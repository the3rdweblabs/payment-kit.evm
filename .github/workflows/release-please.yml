name: Release

# release-please turns Conventional Commits into releases:
#   feat: -> minor | fix:/perf: -> patch | feat!: / BREAKING CHANGE: -> major
# It maintains a release PR (changelog + version) and, once merged, tags the
# release and publishes GitHub Release notes.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          