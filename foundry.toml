# block-timestamp is intentionally excluded: PaymentRegistry's receipt expiry
# compares against block.timestamp by design - expiry windows are minute/day
# granularity, so validator timestamp jitter (±a few seconds) can't affect
# correctness.
[lint]
exclude_lints = ["block-timestamp"]

